name: FileFlow Native macOS

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-macos-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  native:
    name: Native macOS / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ARM64
            os: macos-15
            target: aarch64-apple-darwin
          - name: Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.target }}
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: native-macos-${{ matrix.target }}
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Platform preflight
        run: |
          pnpm run ci:platform-info
          pnpm run ci:preflight
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Native compile + Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Native Rust tests
        run: cargo test --workspace --locked

  package-smoke:
    name: Package smoke macOS / ${{ matrix.name }}
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ARM64
            os: macos-15
            target: aarch64-apple-darwin
          - name: Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: native-macos-${{ matrix.target }}
          cache-on-failure: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Provision FULL engine runtime
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: fileflow-engines
          create-args: >-
          python=3.12
          pip
          ffmpeg
          imagemagick
          libvips
          qpdf
          7zip
          zstd
          lz4
          exiftool
          tesseract
          poppler
          ghostscript
          pandoc
          ocrmypdf
          img2pdf
          cache-environment: true
          cache-downloads: true
      - name: Provision LibreOffice engine
        run: |
          brew list --cask libreoffice >/dev/null 2>&1 || brew install --cask libreoffice
      - name: Build + certify FULL engines
        timeout-minutes: 60
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python scripts/release/build-native-engine-pack.py --target '${{ matrix.target }}' --prefix "$CONDA_PREFIX"
          python scripts/release/stage-engines.py --target '${{ matrix.target }}' --mode full
          python scripts/release/harden-engine-pack.py --target '${{ matrix.target }}' --sign-identity -
          python scripts/release/validate-engine-pack.py --target '${{ matrix.target }}'
          python scripts/release/smoke-engines.py --mode full
          python scripts/release/functional-engine-tests.py --mode full
          python scripts/release/make-engine-pack.py --target '${{ matrix.target }}' --source src-tauri/resources/engines --licenses src-tauri/resources/licenses
          python scripts/release/generate-release-config.py --target '${{ matrix.target }}'
      - name: Build package smoke
        run: pnpm exec tauri build --target '${{ matrix.target }}' --bundles app,dmg --config src-tauri/tauri.release.conf.json
      - name: Validate package smoke
        timeout-minutes: 3
        run: |
          node scripts/release/validate-distribution.mjs --target '${{ matrix.target }}'
          node scripts/release/smoke-packaged-app.mjs --target '${{ matrix.target }}'
      - name: Collect candidate artifacts
        run: node scripts/release/collect-artifacts.mjs --target '${{ matrix.target }}'

      - name: Upload macOS candidate
        uses: actions/upload-artifact@v7
        with:
          name: fileflow-macos-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}-candidate
          path: dist/release/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish Git-only install payload
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: python scripts/release/publish-git-payload.py --target '${{ matrix.target }}' --root 'dist/release/${{ matrix.target }}'
