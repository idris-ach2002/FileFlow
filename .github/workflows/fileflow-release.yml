name: FileFlow Atomic Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_sha:
        description: Commit de main déjà validé par FileFlow Common Quality
        required: true
        type: string
      version:
        description: Version exacte X.Y.Z à publier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    uses: ./.github/workflows/release-linux.yml
    with:
      release_ref: ${{ inputs.release_sha || github.sha }}
      release_version: ${{ inputs.version || github.ref_name }}
    secrets: inherit

  macos:
    uses: ./.github/workflows/release-macos.yml
    with:
      release_ref: ${{ inputs.release_sha || github.sha }}
      release_version: ${{ inputs.version || github.ref_name }}
    secrets: inherit

  windows:
    uses: ./.github/workflows/release-windows.yml
    with:
      release_ref: ${{ inputs.release_sha || github.sha }}
      release_version: ${{ inputs.version || github.ref_name }}
    secrets: inherit

  publish:
    name: Verify five targets and publish
    needs: [linux, macos, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-node@v6
        with: { node-version: '22.22.3' }
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: dist/release
      - name: Restore target directories
        shell: bash
        run: |
          for dir in dist/release/native-*; do
            test -d "$dir" || continue
            target="${dir##*/native-}"
            test ! -e "dist/release/$target"
            mv "$dir" "dist/release/$target"
          done
      - name: Verify signed atomic update set
        env:
          FILEFLOW_RELEASE_REF: ${{ inputs.release_sha || github.sha }}
          FILEFLOW_RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          EXPECTED="$FILEFLOW_RELEASE_VERSION"
          EXPECTED="${EXPECTED#v}"
          [[ "$FILEFLOW_RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED" = "$VERSION"
          test "$(git rev-parse HEAD)" = "$FILEFLOW_RELEASE_REF"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          node scripts/release/normalize-artifacts.mjs --root dist/release
          node scripts/release/generate-updater-manifest.mjs --root dist/release --version "$VERSION" --repository "$GITHUB_REPOSITORY" --output latest.json
          node scripts/release/generate-download-manifest.mjs --root dist/release --version "$VERSION" --repository "$GITHUB_REPOSITORY" --output downloads.json
          node scripts/release/generate-checksums.mjs --root dist/release --output SHA256SUMS
          node scripts/release/verify-release.mjs --root dist/release --latest latest.json --checksums SHA256SUMS
      - name: Publish only after every platform is green
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v${VERSION}"
          SOURCE_SHA=$(git rev-parse HEAD)
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
            test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA" || {
              echo "$TAG existe mais ne pointe pas sur $SOURCE_SHA" >&2
              exit 2
            }
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="$SOURCE_SHA" >/dev/null
          fi
          gh release view "$TAG" >/dev/null 2>&1 && { echo "Release already exists" >&2; exit 2; } || true
          mapfile -d '' ASSETS < <(find dist/release -type f -print0 | sort -z)
          gh release create "$TAG" "${ASSETS[@]}" latest.json downloads.json SHA256SUMS --verify-tag --title "FileFlow ${VERSION}" --notes "Release atomique signée de FileFlow, FileFlow Setup et son CLI pour macOS, Windows et Linux. Provenance: ${SOURCE_SHA}."
      - name: Verify public updater endpoint and artifacts
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          node scripts/release/verify-live-updater.mjs \
            --expected-version "$VERSION" \
            --require-platforms darwin-aarch64,darwin-x86_64,windows-x86_64,linux-x86_64,linux-aarch64 \
            --attempts 18 \
            --delay-ms 5000
          node scripts/release/verify-live-downloads.mjs \
            --expected-version "$VERSION" \
            --require-platforms darwin-aarch64,darwin-x86_64,windows-x86_64,linux-x86_64,linux-aarch64 \
            --attempts 18 \
            --delay-ms 5000
