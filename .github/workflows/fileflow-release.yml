name: FileFlow Atomic Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    uses: ./.github/workflows/release-linux.yml
    secrets: inherit

  macos:
    uses: ./.github/workflows/release-macos.yml
    secrets: inherit

  windows:
    uses: ./.github/workflows/release-windows.yml
    secrets: inherit

  publish:
    name: Verify five targets and publish
    needs: [linux, macos, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v6
        with: { node-version: '22.22.3' }
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: dist/release
      - name: Restore target directories
        shell: bash
        run: |
          for dir in dist/release/native-*; do
            test -d "$dir" || continue
            target="${dir##*/native-}"
            test ! -e "dist/release/$target"
            mv "$dir" "dist/release/$target"
          done
      - name: Verify signed atomic update set
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "$GITHUB_REF_NAME" = "v${VERSION}"
          node scripts/release/normalize-artifacts.mjs --root dist/release
          node scripts/release/generate-updater-manifest.mjs --root dist/release --version "$VERSION" --repository "$GITHUB_REPOSITORY" --output latest.json
          node scripts/release/generate-checksums.mjs --root dist/release --output SHA256SUMS
          node scripts/release/verify-release.mjs --root dist/release --latest latest.json --checksums SHA256SUMS
      - name: Publish only after every platform is green
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && { echo "Release already exists" >&2; exit 2; } || true
          mapfile -d '' ASSETS < <(find dist/release -type f -print0 | sort -z)
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" latest.json SHA256SUMS --verify-tag --title "FileFlow ${GITHUB_REF_NAME#v}" --notes "Release atomique signée pour macOS, Windows et Linux. Les moteurs de conversion restent installés localement par install.sh/install.ps1. Provenance: ${GITHUB_SHA}."
