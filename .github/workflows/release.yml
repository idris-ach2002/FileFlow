name: FileFlow Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Enable pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Resolve exact release version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          EXPECTED="v${VERSION}"
          test "${GITHUB_REF_TYPE}" = "tag" || { echo "Certified releases are tag-only" >&2; exit 2; }
          test "${GITHUB_REF_NAME}" = "$EXPECTED" || {
            echo "Tag ${GITHUB_REF_NAME} does not match FileFlow version $EXPECTED" >&2
            exit 2
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate source/release invariants
        shell: bash
        run: |
          pnpm run ci:preflight
          python scripts/release/check-release.py

      - name: Require production release credentials/configuration
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          FILEFLOW_UPDATE_ENDPOINT: ${{ vars.FILEFLOW_UPDATE_ENDPOINT }}
          FILEFLOW_ENGINE_PACK_URL_TEMPLATE: ${{ vars.FILEFLOW_ENGINE_PACK_URL_TEMPLATE }}
          FILEFLOW_ENGINE_MODE: ${{ vars.FILEFLOW_ENGINE_MODE }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          missing=0
          for name in \
            TAURI_UPDATER_PUBKEY TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
            WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD FILEFLOW_UPDATE_ENDPOINT \
            FILEFLOW_ENGINE_PACK_URL_TEMPLATE FILEFLOW_ENGINE_MODE WINDOWS_TIMESTAMP_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production setting: $name" >&2
              missing=1
            fi
          done
          [[ "$FILEFLOW_ENGINE_PACK_URL_TEMPLATE" == *'{packVersion}'* ]] || { echo 'Engine URL must contain {packVersion}' >&2; missing=1; }
          [[ "$FILEFLOW_ENGINE_PACK_URL_TEMPLATE" == *'{target}'* ]] || { echo 'Engine URL must contain {target}' >&2; missing=1; }
          [[ "$FILEFLOW_ENGINE_MODE" == 'core' || "$FILEFLOW_ENGINE_MODE" == 'full' ]] || { echo 'Certified release requires FILEFLOW_ENGINE_MODE=core or full' >&2; missing=1; }
          exit "$missing"

  build:
    name: Build / ${{ matrix.name }}
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage,rpm
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage,rpm
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf xdg-utils libfuse2 rpm xvfb file binutils

      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Enable pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Import macOS Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path('certificate.p12').write_bytes(base64.b64decode(os.environ['APPLE_CERTIFICATE']))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" fileflow-build.keychain
          security set-keychain-settings -lut 21600 fileflow-build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" fileflow-build.keychain
          security list-keychains -d user -s fileflow-build.keychain login.keychain-db
          security default-keychain -s fileflow-build.keychain
          security import certificate.p12 -k fileflow-build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" fileflow-build.keychain
          IDENTITY=$(security find-identity -v -p codesigning fileflow-build.keychain | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          test -n "$IDENTITY" || { echo 'Developer ID Application identity not found' >&2; exit 2; }
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          [IO.File]::WriteAllBytes('certificate/certificate.pfx', [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $cert.Thumbprint) { throw 'Windows signing certificate import failed' }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Fetch immutable FileFlow engine pack
        shell: bash
        env:
          FILEFLOW_ENGINE_PACK_URL_TEMPLATE: ${{ vars.FILEFLOW_ENGINE_PACK_URL_TEMPLATE }}
          GITHUB_TOKEN: ${{ github.token }}
          FILEFLOW_ENGINE_PACK_TOKEN: ${{ secrets.FILEFLOW_ENGINE_PACK_TOKEN }}
        run: python scripts/release/fetch-engine-pack.py --target '${{ matrix.target }}'

      - name: Stage native engines
        shell: bash
        env:
          FILEFLOW_ENGINE_MODE: ${{ vars.FILEFLOW_ENGINE_MODE }}
        run: python scripts/release/stage-engines.py --target '${{ matrix.target }}' --mode "${FILEFLOW_ENGINE_MODE:-core}"

      - name: Harden native engine dependencies
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        run: python scripts/release/harden-engine-pack.py --target '${{ matrix.target }}'

      - name: Authenticode-sign Windows engine binaries
        if: runner.os == 'Windows'
        shell: powershell
        env:
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $cert = Get-ChildItem "Cert:\CurrentUser\My\$env:WINDOWS_CERTIFICATE_THUMBPRINT"
          $files = Get-ChildItem src-tauri/resources/engines -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll' }
          foreach ($file in $files) {
            $result = Set-AuthenticodeSignature -FilePath $file.FullName -Certificate $cert -HashAlgorithm SHA256 -TimestampServer $env:WINDOWS_TIMESTAMP_URL
            if ($result.Status -ne 'Valid') { throw "Failed to sign $($file.FullName): $($result.Status)" }
          }

      - name: Refresh engine integrity metadata after Windows signing
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/release/harden-engine-pack.py --target '${{ matrix.target }}'

      - name: Validate native engine architecture/dependencies/signatures
        shell: bash
        run: python scripts/release/validate-engine-pack.py --target '${{ matrix.target }}' --require-signature

      - name: Probe staged engines
        shell: bash
        env:
          FILEFLOW_ENGINE_MODE: ${{ vars.FILEFLOW_ENGINE_MODE }}
        run: python scripts/release/smoke-engines.py --mode "${FILEFLOW_ENGINE_MODE:-core}"

      - name: Functional engine tests
        shell: bash
        env:
          FILEFLOW_ENGINE_MODE: ${{ vars.FILEFLOW_ENGINE_MODE }}
        run: python scripts/release/functional-engine-tests.py --mode "${FILEFLOW_ENGINE_MODE:-core}"

      - name: Generate strict production Tauri configuration
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FILEFLOW_UPDATE_ENDPOINT: ${{ vars.FILEFLOW_UPDATE_ENDPOINT }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ env.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: python scripts/release/generate-release-config.py --target '${{ matrix.target }}' --strict

      - name: Full source verification
        shell: bash
        run: |
          pnpm run ci:preflight
          pnpm run verify

      - name: Build signed/notarized native bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec tauri build --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' --config src-tauri/tauri.release.conf.json

      - name: Strict native bundle validation
        shell: bash
        run: node scripts/release/validate-distribution.mjs --target '${{ matrix.target }}' --strict

      - name: Runtime smoke / macOS and Windows
        if: runner.os != 'Linux'
        shell: bash
        run: node scripts/release/smoke-packaged-app.mjs --target '${{ matrix.target }}'

      - name: Runtime smoke / Linux Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a node scripts/release/smoke-packaged-app.mjs --target '${{ matrix.target }}'

      - name: Stress/recovery/cancellation
        shell: bash
        env:
          FILEFLOW_STRESS_FILES: '5000'
        run: pnpm run ci:stress

      - name: Collect private release artifacts
        shell: bash
        run: node scripts/release/collect-artifacts.mjs --target '${{ matrix.target }}'

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: dist/release/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Atomic draft publication
    needs: build
    if: ${{ success() }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: dist/release

      - name: Restore target directory names
        shell: bash
        run: |
          for dir in dist/release/native-*; do
            test -d "$dir" || continue
            target="${dir##*/native-}"
            mv "$dir" "dist/release/$target"
          done

      - name: Resolve release version
        id: release-version
        shell: bash
        run: echo "version=$(node -p \"require('./src-tauri/tauri.conf.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Normalize cross-platform asset names
        run: node scripts/release/normalize-artifacts.mjs --root dist/release

      - name: Generate static updater manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          node scripts/release/generate-updater-manifest.mjs
          --root dist/release
          --version '${{ steps.release-version.outputs.version }}'
          --repository '${{ github.repository }}'
          --output latest.json

      - name: Generate aggregate SHA-256 checksums
        run: node scripts/release/generate-checksums.mjs --root dist/release --output SHA256SUMS

      - name: Verify complete atomic release set
        run: node scripts/release/verify-release.mjs --root dist/release --latest latest.json --checksums SHA256SUMS

      - name: Verify updater transition
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [[ -n "$PREVIOUS" ]]; then
            FROM="${PREVIOUS#v}"
            node scripts/release/verify-updater-transition.mjs \
              --from "$FROM" \
              --to '${{ steps.release-version.outputs.version }}' \
              --manifest latest.json
          else
            echo 'No previous published release: updater transition check is not applicable.'
          fi

      - name: Refuse mutable release replacement
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view '${{ github.ref_name }}' >/dev/null 2>&1; then
            echo 'A GitHub Release already exists for this tag; refusing to mutate a certified release.' >&2
            exit 2
          fi

      - name: Create release only after all five targets pass
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' ASSETS < <(find dist/release -type f -print0 | sort -z)
          gh release create '${{ github.ref_name }}' \
            "${ASSETS[@]}" latest.json SHA256SUMS \
            --draft \
            --title 'FileFlow ${{ github.ref_name }}' \
            --notes 'Release candidate certifiée par la matrice native FileFlow. Vérifier les installateurs draft puis publier manuellement.'
