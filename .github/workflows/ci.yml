name: FileFlow Common Quality

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: common-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Common Quality / Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf xdg-utils

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: common-linux-x64
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Source/release preflight
        run: |
          pnpm run ci:platform-info
          pnpm run ci:preflight
          pnpm run release:self-test

      - name: Full common source verification
        run: pnpm run verify
