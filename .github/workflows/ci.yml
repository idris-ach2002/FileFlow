name: FileFlow CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
          - name: macOS ARM64
            os: macos-15
          - name: Windows x64
            os: windows-2025
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Enable pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-quality-${{ runner.os }}-${{ runner.arch }}-
          save-always: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: quality-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Platform information
        run: pnpm run ci:platform-info

      - name: Preflight
        run: pnpm run ci:preflight

      - name: Release tooling self-test
        run: pnpm run release:self-test

      - name: Full source verification
        run: pnpm run verify
