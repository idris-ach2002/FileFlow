name: FileFlow Release Linux

on:
  push:
    tags: ['linux-v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release Linux / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils libfuse2 rpm xvfb file patchelf pkg-config
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: release-linux-${{ matrix.target }}
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Validate tag and source
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "$GITHUB_REF_NAME" = "linux-v${VERSION}"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          pnpm run release:check
      - name: Generate production config
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FILEFLOW_UPDATE_ENDPOINT: ${{ vars.FILEFLOW_UPDATE_ENDPOINT }}
        run: python scripts/release/generate-release-config.py --target '${{ matrix.target }}' --strict
      - name: Build release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: TAURI_LINUX_AYATANA_APPINDICATOR=1 pnpm exec tauri build --verbose --target '${{ matrix.target }}' --bundles deb,appimage,rpm --config src-tauri/tauri.release.conf.json
      - name: Validate release
        run: |
          node scripts/release/validate-distribution.mjs --target '${{ matrix.target }}'
          xvfb-run -a node scripts/release/smoke-packaged-app.mjs --target '${{ matrix.target }}'
          node scripts/release/collect-artifacts.mjs --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: dist/release/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Linux
    needs: build
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '22.22.3' }
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: dist/release
      - name: Restore target names
        run: |
          for dir in dist/release/native-*; do test -d "$dir" || continue; target="${dir##*/native-}"; mv "$dir" "dist/release/$target"; done
      - name: Canonicalize and checksum
        run: |
          node scripts/release/canonicalize-installers.mjs --platform linux --root dist/release
          node scripts/release/generate-checksums.mjs --root dist/release --output SHA256SUMS-linux
      - name: Publish immutable release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && { echo "Release already exists" >&2; exit 2; } || true
          mapfile -d '' ASSETS < <(find dist/release -type f -print0 | sort -z)
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" SHA256SUMS-linux --verify-tag --title "FileFlow ${GITHUB_REF_NAME#linux-v} — Linux" --notes "FileFlow app + certified bundled runtime; host engines are fallback only. Provenance: ${GITHUB_SHA}."
