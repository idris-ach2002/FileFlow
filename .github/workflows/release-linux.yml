name: FileFlow Release Linux

on:
  workflow_call:
    inputs:
      release_ref:
        required: true
        type: string
      release_version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release Linux / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref }}
      - name: Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev xdg-utils libfuse2 rpm xvfb file
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: release-linux-${{ matrix.target }}
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Validate tag and source
        shell: bash
        env:
          FILEFLOW_RELEASE_REF: ${{ inputs.release_ref }}
          FILEFLOW_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          EXPECTED="$FILEFLOW_RELEASE_VERSION"
          EXPECTED="${EXPECTED#v}"
          [[ "$FILEFLOW_RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED" = "$VERSION"
          test "$(git rev-parse HEAD)" = "$FILEFLOW_RELEASE_REF"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          pnpm run release:check
      - name: Generate production config
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FILEFLOW_UPDATE_ENDPOINT: ${{ vars.FILEFLOW_UPDATE_ENDPOINT }}
        run: python scripts/release/generate-release-config.py --target '${{ matrix.target }}' --strict
      - name: Build release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --target '${{ matrix.target }}' --bundles deb,appimage,rpm --config src-tauri/tauri.release.conf.json
      - name: Build FileFlow Setup and CLI
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/fileflow-setup
          FILEFLOW_SETUP_TARGET_DIR: ${{ github.workspace }}/target/fileflow-setup
        run: |
          node scripts/setup/run-tauri.mjs build --target '${{ matrix.target }}' --bundles deb,appimage,rpm --config tauri.release.conf.json
          cargo build --release -p fileflow-setup --bin fileflow-setup-cli --target '${{ matrix.target }}'
          node scripts/release/package-setup-cli.mjs --target '${{ matrix.target }}'
      - name: Validate release
        run: |
          node scripts/release/validate-distribution.mjs --target '${{ matrix.target }}' --require-setup
          xvfb-run -a node scripts/release/smoke-packaged-app.mjs --target '${{ matrix.target }}'
          xvfb-run -a node scripts/release/smoke-packaged-setup.mjs --target '${{ matrix.target }}'
          xvfb-run -a node scripts/release/e2e-native.mjs --target '${{ matrix.target }}' --version '${{ inputs.release_version }}'
          node scripts/release/collect-artifacts.mjs --target '${{ matrix.target }}' --include-setup
          cp 'dist/e2e-attestations/${{ matrix.target }}.json' 'dist/release/${{ matrix.target }}/e2e-attestation.json'
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: dist/release/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
