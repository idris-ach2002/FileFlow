name: FileFlow Release Windows

on:
  workflow_call:
    inputs:
      release_ref:
        required: true
        type: string
      release_version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release Windows / x64
    runs-on: windows-2025
    env:
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: release-windows-x64
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Native Windows Setup regression tests
        shell: pwsh
        run: |
          node scripts/setup/test-windows-powershell-source.mjs
          pnpm run setup:test
          cargo clippy -p fileflow-setup -p fileflow-setup-core --all-targets -- -D warnings
      - name: Validate tag and source
        shell: pwsh
        env:
          FILEFLOW_RELEASE_REF: ${{ inputs.release_ref }}
          FILEFLOW_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          $version = node -p "require('./src-tauri/tauri.conf.json').version"
          $expected = $env:FILEFLOW_RELEASE_VERSION.TrimStart('v')
          if ($env:FILEFLOW_RELEASE_REF -notmatch '^[0-9a-f]{40}$') { throw 'invalid release SHA' }
          if ($expected -ne $version) { throw 'release input/version mismatch' }
          if ((git rev-parse HEAD) -ne $env:FILEFLOW_RELEASE_REF) { throw 'release source mismatch' }
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'release tag must point to main' }
          pnpm run release:check
          ./scripts/ci/windows-preflight.ps1
      - name: Import signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificateMissing = [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)
          $passwordMissing = [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($certificateMissing -and $passwordMissing) {
            Write-Host 'No Authenticode certificate configured; producing unsigned Windows installers with signed Tauri updater artifacts.'
            exit 0
          }
          if ($certificateMissing -or $passwordMissing) {
            throw 'WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD must be configured together'
          }
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          [IO.File]::WriteAllBytes('certificate/certificate.pfx',[Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password=ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert=Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if(-not $cert.Thumbprint){throw 'certificate import failed'}
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Generate production config
        shell: pwsh
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FILEFLOW_UPDATE_ENDPOINT: ${{ vars.FILEFLOW_UPDATE_ENDPOINT }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: python scripts/release/generate-release-config.py --target x86_64-pc-windows-msvc --strict
      - name: Build signed release
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi --config src-tauri/tauri.release.conf.json
      - name: Build FileFlow Setup and CLI
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/fileflow-setup
          FILEFLOW_SETUP_TARGET_DIR: ${{ github.workspace }}/target/fileflow-setup
        run: |
          node scripts/setup/run-tauri.mjs build --target x86_64-pc-windows-msvc --bundles nsis,msi --config tauri.release.conf.json
          cargo build --release -p fileflow-setup --bin fileflow-setup-cli --target x86_64-pc-windows-msvc
          node scripts/release/package-setup-cli.mjs --target x86_64-pc-windows-msvc
      - name: Validate release
        shell: pwsh
        run: |
          $validationArgs = @('--target', 'x86_64-pc-windows-msvc', '--require-setup')
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_THUMBPRINT)) {
            $validationArgs += '--strict'
          }
          node scripts/release/validate-distribution.mjs @validationArgs
          node scripts/release/smoke-packaged-app.mjs --target x86_64-pc-windows-msvc
          node scripts/release/smoke-packaged-setup.mjs --target x86_64-pc-windows-msvc
          node scripts/release/e2e-native.mjs --target x86_64-pc-windows-msvc --version '${{ inputs.release_version }}'
          node scripts/release/collect-artifacts.mjs --target x86_64-pc-windows-msvc --include-setup
          Copy-Item 'dist/e2e-attestations/x86_64-pc-windows-msvc.json' -Destination 'dist/release/x86_64-pc-windows-msvc/e2e-attestation.json' -Force
      - uses: actions/upload-artifact@v7
        with:
          name: native-x86_64-pc-windows-msvc
          path: dist/release/x86_64-pc-windows-msvc
          if-no-files-found: error
          retention-days: 14
