name: FileFlow Release macOS

on:
  push:
    tags: ['macos-v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release macOS / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ARM64
            os: macos-15
            target: aarch64-apple-darwin
          - name: Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: release-macos-${{ matrix.target }}
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Validate tag and source
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "$GITHUB_REF_NAME" = "macos-v${VERSION}"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          pnpm run release:check
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path('certificate.p12').write_bytes(base64.b64decode(os.environ['APPLE_CERTIFICATE']))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" fileflow-build.keychain
          security set-keychain-settings -lut 21600 fileflow-build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" fileflow-build.keychain
          security list-keychains -d user -s fileflow-build.keychain login.keychain-db
          security default-keychain -s fileflow-build.keychain
          security import certificate.p12 -k fileflow-build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" fileflow-build.keychain
          IDENTITY=$(security find-identity -v -p codesigning fileflow-build.keychain | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          test -n "$IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Generate production config
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FILEFLOW_UPDATE_ENDPOINT: ${{ vars.FILEFLOW_UPDATE_ENDPOINT }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python scripts/release/generate-release-config.py --target '${{ matrix.target }}' --strict
      - name: Build signed/notarized release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec tauri build --target '${{ matrix.target }}' --bundles app,dmg --config src-tauri/tauri.release.conf.json
      - name: Validate release
        run: |
          node scripts/release/validate-distribution.mjs --target '${{ matrix.target }}' --strict
          node scripts/release/smoke-packaged-app.mjs --target '${{ matrix.target }}'
          node scripts/release/collect-artifacts.mjs --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: dist/release/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish macOS
    needs: build
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '22.22.3' }
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: dist/release
      - run: |
          for dir in dist/release/native-*; do test -d "$dir" || continue; target="${dir##*/native-}"; mv "$dir" "dist/release/$target"; done
      - name: Canonicalize and checksum
        run: |
          node scripts/release/normalize-artifacts.mjs --root dist/release
          node scripts/release/canonicalize-installers.mjs --platform macos --root dist/release
          node scripts/release/generate-checksums.mjs --root dist/release --output SHA256SUMS-macos
      - name: Publish immutable release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && { echo "Release already exists" >&2; exit 2; } || true
          mapfile -d '' ASSETS < <(find dist/release -type f -print0 | sort -z)
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" SHA256SUMS-macos --verify-tag --title "FileFlow ${GITHUB_REF_NAME#macos-v} — macOS" --notes "FileFlow app + certified bundled runtime; host engines are fallback only. Provenance: ${GITHUB_SHA}."
