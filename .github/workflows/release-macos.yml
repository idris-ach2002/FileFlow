name: FileFlow Release macOS

on:
  workflow_call:
    inputs:
      release_ref:
        required: true
        type: string
      release_version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release macOS / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ARM64
            os: macos-15
            target: aarch64-apple-darwin
          - name: Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: release-macos-${{ matrix.target }}
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Validate tag and source
        env:
          FILEFLOW_RELEASE_REF: ${{ inputs.release_ref }}
          FILEFLOW_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          EXPECTED="$FILEFLOW_RELEASE_VERSION"
          EXPECTED="${EXPECTED#v}"
          [[ "$FILEFLOW_RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED" = "$VERSION"
          test "$(git rev-parse HEAD)" = "$FILEFLOW_RELEASE_REF"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          pnpm run release:check
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" && -z "$APPLE_CERTIFICATE_PASSWORD" ]]; then
            echo "No Developer ID certificate configured; using ad-hoc macOS signing."
            exit 0
          fi
          if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_CERTIFICATE_PASSWORD" ]]; then
            echo "APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD must be configured together." >&2
            exit 2
          fi
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path('certificate.p12').write_bytes(base64.b64decode(os.environ['APPLE_CERTIFICATE']))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" fileflow-build.keychain
          security set-keychain-settings -lut 21600 fileflow-build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" fileflow-build.keychain
          security list-keychains -d user -s fileflow-build.keychain login.keychain-db
          security default-keychain -s fileflow-build.keychain
          security import certificate.p12 -k fileflow-build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" fileflow-build.keychain
          IDENTITY=$(security find-identity -v -p codesigning fileflow-build.keychain | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          test -n "$IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Configure optional notarization credentials
        env:
          INPUT_APPLE_ID: ${{ secrets.APPLE_ID }}
          INPUT_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          INPUT_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$INPUT_APPLE_ID" && -z "$INPUT_APPLE_PASSWORD" && -z "$INPUT_APPLE_TEAM_ID" ]]; then
            echo "No Apple notarization credentials configured; notarization disabled."
            exit 0
          fi
          if [[ -z "$INPUT_APPLE_ID" || -z "$INPUT_APPLE_PASSWORD" || -z "$INPUT_APPLE_TEAM_ID" ]]; then
            echo "APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID must be configured together." >&2
            exit 2
          fi
          {
            echo "APPLE_ID=$INPUT_APPLE_ID"
            echo "APPLE_PASSWORD=$INPUT_APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$INPUT_APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
      - name: Generate production config
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FILEFLOW_UPDATE_ENDPOINT: ${{ vars.FILEFLOW_UPDATE_ENDPOINT }}
        run: python scripts/release/generate-release-config.py --target '${{ matrix.target }}' --strict
      - name: Build signed/notarized release
        env:
          CI: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --target '${{ matrix.target }}' --bundles app,dmg --config src-tauri/tauri.release.conf.json
      - name: Build FileFlow Setup and CLI
        env:
          CI: 'true'
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/fileflow-setup
          FILEFLOW_SETUP_TARGET_DIR: ${{ github.workspace }}/target/fileflow-setup
        run: |
          node scripts/setup/run-tauri.mjs build --target '${{ matrix.target }}' --bundles app,dmg --config tauri.release.conf.json
          cargo build --release -p fileflow-setup --bin fileflow-setup-cli --target '${{ matrix.target }}'
          node scripts/release/package-setup-cli.mjs --target '${{ matrix.target }}'
      - name: Validate release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VALIDATION_ARGS=()
          if [[ -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            VALIDATION_ARGS+=(--strict)
          fi
          node scripts/release/validate-distribution.mjs --target '${{ matrix.target }}' --require-setup "${VALIDATION_ARGS[@]}"
          node scripts/release/smoke-packaged-app.mjs --target '${{ matrix.target }}'
          node scripts/release/smoke-packaged-setup.mjs --target '${{ matrix.target }}'
          node scripts/release/e2e-native.mjs --target '${{ matrix.target }}' --version '${{ inputs.release_version }}'
          cargo test -p fileflow-executor --all-features --locked
          node scripts/release/conversion-e2e.mjs --target '${{ matrix.target }}' --version '${{ inputs.release_version }}' --output 'dist/conversion-attestations/${{ matrix.target }}.json'
          node scripts/release/collect-artifacts.mjs --target '${{ matrix.target }}' --include-setup
          cp 'dist/conversion-attestations/${{ matrix.target }}.json' 'dist/release/${{ matrix.target }}/conversion-attestation.json'
          cp 'dist/e2e-attestations/${{ matrix.target }}.json' 'dist/release/${{ matrix.target }}/e2e-attestation.json'
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: dist/release/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
