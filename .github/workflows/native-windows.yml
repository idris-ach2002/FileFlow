name: FileFlow Native Windows

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-windows-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows / x64
    runs-on: windows-2025
    env:
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: native-windows-x64
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Windows PowerShell 5.1 source guard
        shell: powershell
        run: |
          $files = @(
            'install.ps1',
            'scripts/runtime/install-dependencies.ps1',
            'scripts/runtime/doctor.ps1'
          )

          foreach ($file in $files) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $file))
            if (@($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
              throw "$file must remain ASCII for Windows PowerShell 5.1 compatibility."
            }

            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )

            if ($errors.Count -gt 0) {
              foreach ($error in $errors) {
                Write-Host ("{0}:{1}:{2}: {3}" -f
                  $file,
                  $error.Extent.StartLineNumber,
                  $error.Extent.StartColumnNumber,
                  $error.Message)
              }
              throw "$file contains PowerShell parser errors."
            }

            Write-Host "[OK] $file PowerShell 5.1 parse + ASCII"
          }

      - name: Platform/source preflight
        shell: pwsh
        run: |
          pnpm run ci:platform-info
          pnpm run ci:preflight
          pnpm run release:check
          ./scripts/ci/windows-preflight.ps1
          cargo check --workspace --all-features --locked --target x86_64-pc-windows-msvc
      - name: Generate lightweight package config
        shell: pwsh
        run: python scripts/release/generate-release-config.py --target x86_64-pc-windows-msvc
      - name: Build FileFlow app only
        shell: pwsh
        run: pnpm exec tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi --config src-tauri/tauri.release.conf.json
      - name: Build FileFlow Setup and CLI
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/fileflow-setup
          FILEFLOW_SETUP_TARGET_DIR: ${{ github.workspace }}/target/fileflow-setup
        run: |
          node scripts/setup/run-tauri.mjs build --target x86_64-pc-windows-msvc --bundles nsis,msi --config tauri.release.conf.json
          cargo build --release -p fileflow-setup --bin fileflow-setup-cli --target x86_64-pc-windows-msvc
          node scripts/release/package-setup-cli.mjs --target x86_64-pc-windows-msvc
      - name: Package smoke
        shell: pwsh
        run: |
          node scripts/release/validate-distribution.mjs --target x86_64-pc-windows-msvc --require-setup
          node scripts/release/smoke-packaged-app.mjs --target x86_64-pc-windows-msvc
          node scripts/release/smoke-packaged-setup.mjs --target x86_64-pc-windows-msvc
          node scripts/release/collect-artifacts.mjs --target x86_64-pc-windows-msvc --include-setup
      - uses: actions/upload-artifact@v7
        with:
          name: fileflow-windows-x86_64-pc-windows-msvc-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/release/x86_64-pc-windows-msvc
          if-no-files-found: error
          retention-days: 14
      - name: Publish install payload
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: pwsh
        run: python scripts/release/publish-git-payload.py --target x86_64-pc-windows-msvc --root dist/release/x86_64-pc-windows-msvc
