name: FileFlow Native Windows

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native Windows / x64
    runs-on: windows-2025
    env:
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: x86_64-pc-windows-msvc
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          # Keep the historic key prefix once so the 422 MB cache already
          # produced by the old Windows job can be reused where possible.
          shared-key: quality-Windows-X64
          cache-on-failure: true

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Windows deterministic preflight
        shell: pwsh
        run: ./scripts/ci/windows-preflight.ps1

      - name: Windows platform preflight
        shell: pwsh
        run: |
          pnpm run ci:platform-info
          pnpm run ci:preflight

      - name: Windows native compile + Clippy
        shell: pwsh
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Windows native Rust tests
        shell: pwsh
        run: cargo test --workspace --locked

  package-smoke:
    name: Package smoke Windows / x64
    needs: native
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: windows-2025
    env:
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: quality-Windows-X64
          cache-on-failure: true
      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Deterministic Windows gate
        shell: pwsh
        run: ./scripts/ci/windows-preflight.ps1
      - name: Provision FULL engine runtime
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: fileflow-engines
          create-args: "python=3.12 pip ffmpeg imagemagick libvips qpdf 7zip zstd lz4 exiftool tesseract poppler ghostscript pandoc ocrmypdf img2pdf"
          cache-environment: true
          cache-downloads: true
          init-shell: powershell
      - name: Provision LibreOffice engine
        shell: pwsh
        run: choco install libreoffice-fresh -y --no-progress
      - name: Build + certify FULL engines
        timeout-minutes: 60
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/release/build-native-engine-pack.py --target x86_64-pc-windows-msvc --prefix "$env:CONDA_PREFIX"
          python scripts/release/stage-engines.py --target x86_64-pc-windows-msvc --mode full
          python scripts/release/harden-engine-pack.py --target x86_64-pc-windows-msvc
          python scripts/release/validate-engine-pack.py --target x86_64-pc-windows-msvc
          python scripts/release/smoke-engines.py --mode full
          python scripts/release/functional-engine-tests.py --mode full
          python scripts/release/make-engine-pack.py --target x86_64-pc-windows-msvc --source src-tauri/resources/engines --licenses src-tauri/resources/licenses
          python scripts/release/generate-release-config.py --target x86_64-pc-windows-msvc
      - name: Build package smoke
        shell: pwsh
        run: pnpm exec tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi --config src-tauri/tauri.release.conf.json
      - name: Validate package smoke
        shell: pwsh
        run: |
          node scripts/release/validate-distribution.mjs --target x86_64-pc-windows-msvc
          node scripts/release/smoke-packaged-app.mjs --target x86_64-pc-windows-msvc

      - name: Collect candidate artifacts
        shell: pwsh
        run: node scripts/release/collect-artifacts.mjs --target x86_64-pc-windows-msvc

      - name: Upload Windows candidate
        uses: actions/upload-artifact@v7
        with:
          name: fileflow-windows-x86_64-pc-windows-msvc-${{ github.event.pull_request.head.sha || github.sha }}-candidate
          path: dist/release/x86_64-pc-windows-msvc
          if-no-files-found: error
          retention-days: 14

      - name: Publish Git-only install payload
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: pwsh
        run: python scripts/release/publish-git-payload.py --target 'x86_64-pc-windows-msvc' --root 'dist/release/x86_64-pc-windows-msvc'
