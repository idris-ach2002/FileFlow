[package]
name = "fileflow-executor"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
base64.workspace = true
fileflow-domain = { path = "../fileflow-domain" }
fileflow-formats = { path = "../fileflow-formats" }
fileflow-output = { path = "../fileflow-output" }
fileflow-planner = { path = "../fileflow-planner" }
fileflow-scheduler = { path = "../fileflow-scheduler" }
chrono.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
