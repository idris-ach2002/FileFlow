[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/fileflow-domain",
    "crates/fileflow-analysis",
    "crates/fileflow-engine",
    "crates/fileflow-core",
    "crates/fileflow-intake",
    "crates/fileflow-formats",
    "crates/fileflow-workspace",
    "crates/fileflow-planner",
    "crates/fileflow-scheduler",
    "crates/fileflow-executor",
    "crates/fileflow-output",
    "crates/fileflow-storage",
    "crates/adapters/fileflow-adapter-ffmpeg",
    "crates/adapters/fileflow-adapter-vips",
    "crates/adapters/fileflow-adapter-qpdf",
    "crates/adapters/fileflow-adapter-office",
    "crates/adapters/fileflow-adapter-ocr",
    "crates/adapters/fileflow-adapter-archive",
    "crates/adapters/fileflow-adapter-metadata",
    "crates/adapters/fileflow-adapter-imagemagick",
    "crates/adapters/fileflow-adapter-img2pdf",
    "crates/adapters/fileflow-adapter-poppler",
    "crates/adapters/fileflow-adapter-ghostscript",
    "crates/adapters/fileflow-adapter-tesseract",
    "crates/adapters/fileflow-adapter-pandoc",
    "crates/adapters/fileflow-adapter-zstd",
    "crates/adapters/fileflow-adapter-lz4",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
infer = "0.19"
parking_lot = "0.12"
rusqlite = { version = "0.40.1", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
sysinfo = "0.39.6"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
walkdir = "2"
